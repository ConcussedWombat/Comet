# Copy to `comet.toml` (git-ignored) and point it at YOUR files.
# Every path must be OUTSIDE the repository; the tools refuse otherwise.
# Environment variables (shown below) take precedence over this file.
# COMET_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: COMET_GAME_DIR
game_dir = 'D:\comet-data\game'

# Derived data. Default: %LOCALAPPDATA%\comet\cache.   env: COMET_CACHE_DIR
# cache_dir = 'D:\comet-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\comet\data.   env: COMET_DATA_DIR
# data_dir = 'D:\comet-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: COMET_TEST_TITLES (separated by ';')
test_titles = []
