[package]
name = "comet"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
comet-core.workspace = true
comet-pe.workspace = true
comet-loader.workspace = true
comet-hle.workspace = true
comet-shader = { workspace = true, features = ["host"] }
comet-game.workspace = true
comet-gpu.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true

[features]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "comet-core/diagnostics",
    "comet-hle/diagnostics",
    "comet-loader/diagnostics",
    "comet-shader/diagnostics",
]

[lints]
workspace = true
