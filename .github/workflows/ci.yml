name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build Comet
        run: cargo build --release --locked -p comet
      - name: CLI smoke test
        shell: powershell
        run: |
          & .\target\release\comet.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\target\release\comet.exe config
          exit $LASTEXITCODE
      - name: Launcher regression test
        shell: powershell
        run: .\scripts\test-launcher.ps1
      - name: Benchmark parser regression test
        shell: powershell
        run: .\scripts\test-benchmark.ps1
      - name: Package Windows x64
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'comet-package'
          New-Item -ItemType Directory -Force (Join-Path $stage 'target\release'), (Join-Path $stage 'scripts') | Out-Null
          Copy-Item .\target\release\comet.exe (Join-Path $stage 'target\release')
          Copy-Item .\scripts\play.ps1, .\scripts\summarize-benchmark.ps1 (Join-Path $stage 'scripts')
          Copy-Item .\LICENSE, .\README.md, .\comet.example.toml $stage
          $zip = Join-Path $env:RUNNER_TEMP 'comet-windows-x64.zip'
          Compress-Archive -Path "$stage\*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$hash  comet-windows-x64.zip" | Set-Content -Encoding ASCII "$zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: comet-windows-x64
          path: |
            ${{ runner.temp }}/comet-windows-x64.zip
            ${{ runner.temp }}/comet-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: comet-windows-x64
          path: release
      - name: Publish tagged release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" release/comet-windows-x64.zip release/comet-windows-x64.zip.sha256 --verify-tag --generate-notes --prerelease
          exit $LASTEXITCODE
