<svg xmlns="http://www.w3.org/2000/svg" width="820" height="435" viewBox="0 0 820 435" role="img" aria-labelledby="title desc">
  <title id="title">Component completion</title>
  <desc id="desc">Executable loader: 80%; Runtime / HLE: 60%; Graphics / D3D12.X: 45%; Shader translation: 60%; Texture and audio formats: 65%; Asset pipeline and caching: 70%; Ray tracing: 20%; Performance: 10%; Stability and testing: 30%; Launcher and tooling: 80%. Estimates toward a first playable release.</desc>
